# Site Settings
locale                   : "en-NZ"
title                    : "Aeryn Dunmore"
title_separator          : "-"
name                     : "Aeryn Dunmore"
description              : "PhD Candidate in Machine Learning and Affective Computing, University of Auckland."
url                      : "https://aeryn-dunmore.github.io"
baseurl                  : ""
repository               : "aeryn-dunmore/aeryn-dunmore.github.io"
teaser                   :
breadcrumbs              : false
words_per_minute         : 200
read_more                : "disabled"
comments:
  provider               :

# SEO Related
google_site_verification :
bing_site_verification   :
alexa_site_verification  :
yandex_site_verification :

# Site Author
author:
  name             : "Aeryn Dunmore"
  avatar           : "profile.jpg"
  pronouns         : "she/her"
  bio              : "PhD Candidate · Machine Learning & Affective Computing · University of Auckland"
  location         : "Auckland, New Zealand"
  employer         : "Auckland Bioengineering Institute"
  uri              :
  email            : "a.dunmore@aucklanduni.ac.nz"

  # Academic websites
  arxiv            :
  googlescholar    : "https://scholar.google.com/citations?user=BgURrfUAAAAJ&hl=en"
  impactstory      :
  orcid            :
  researchgate     : "https://www.researchgate.net/profile/Aeryn-Dunmore"
  pubmed           :

  # Social
  github           : "aeryn-dunmore"
  linkedin         : "aeryndunmore"
  twitter          :

# Reading Files
include:
  - .htaccess
  - _pages
exclude:
  - "*.sublime-project"
  - "*.sublime-workspace"
  - .asset-cache
  - .bundle
  - .jekyll-assets-cache
  - .sass-cache
  - assets/js/plugins
  - assets/js/_main.js
  - assets/js/vendor
  - Capfile
  - CHANGELOG
  - config
  - Gemfile
  - Gruntfile.js
  - gulpfile.js
  - LICENSE
  - log
  - node_modules
  - package.json
  - Rakefile
  - README
  - tmp
keep_files:
  - .git
  - .svn
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"

# Conversion
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

# Markdown Processing
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false

# Collections
collections:
  teaching:
    output: true
    permalink: /:collection/:path/
  publications:
    output: true
    permalink: /:collection/:path/
  portfolio:
    output: true
    permalink: /:collection/:path/
  talks:
    output: true
    permalink: /:collection/:path/

# Defaults
defaults:
  # _posts
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: true
      share: true
      related: true
  # _pages
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true
  # _teaching
  - scope:
      path: ""
      type: teaching
    values:
      layout: single
      author_profile: true
      share: true
      comments: true
  # _publications
  - scope:
      path: ""
      type: publications
    values:
      layout: single
      author_profile: true
      share: true
      comments: true
  # _portfolio
  - scope:
      path: ""
      type: portfolio
    values:
      layout: single
      author_profile: true
      share: true
      comment: true
  # _talks
  - scope:
      path: ""
      type: talks
    values:
      layout: talk
      author_profile: true
      share: true

# Sass/SCSS
sass:
  sass_dir: _sass
  style: compressed

# Outputting
permalink: /:categories/:title/
timezone: Pacific/Auckland

# Plugins
gems:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jemoji

# mimic GitHub Pages with --safe
whitelist:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jemoji

# Archives
category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/

# HTML Compression
compress_html:
  clippings: all
  ignore:
    envs: development
